name: app-authentication
services:
  postgres:
    image: postgres:18-alpine
    container_name: app-auth-postgres
    restart: unless-stopped
    ports:
      - 5432:5432
    environment:
      POSTGRES_DB: app_authentication
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: app_password
      PGDATA: /var/lib/postgresql
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U app_user -d app_authentication']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app_network

  server:
    build:
      context: ../server
    container_name: app-auth-server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://app_user:app_password@postgres:5432/app_authentication?schema=public
      CLIENT_ORIGIN: https://localhost
    env_file:
      - ../server/.env
    networks:
      - app_network

  client:
    build:
      context: ../client
      args:
        VITE_BACKEND_URL: ${VITE_BACKEND_URL}
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID}
        VITE_FACEBOOK_APP_ID: ${VITE_FACEBOOK_APP_ID}
        VITE_MICROSOFT_CLIENT_ID: ${VITE_MICROSOFT_CLIENT_ID}
        VITE_MICROSOFT_AUTHORITY: ${VITE_MICROSOFT_AUTHORITY}
    container_name: app-auth-client
    restart: unless-stopped
    networks:
      - app_network

  nginx:
    image: nginx:alpine
    container_name: app-auth-nginx
    restart: unless-stopped
    depends_on:
      - client
      - server
    ports:
      - 80:80
      - 443:443
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    networks:
      - app_network

  pgadmin:
    image: dpage/pgadmin4
    container_name: app-auth-pgadmin
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - 5050:80
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@domain.com
      PGADMIN_DEFAULT_PASSWORD: admin_password
      PGADMIN_CONFIG_ENHANCED_COOKIE_PROTECTION: 'True'
      PGADMIN_CONFIG_CONSOLE_LOG_LEVEL: 20
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - app_network

networks:
  app_network:

volumes:
  postgres_data:
  pgadmin_data:
